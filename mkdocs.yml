# Generated by kiln 0.1.0 from .rn-forge/kiln/config.toml — do not edit; run 'kiln apply'
site_name: agentkit
site_url: https://rn-tools.github.io/agentkit/
repo_url: https://github.com/rn-tools/agentkit
site_description: agentkit — architecture, guides, and API reference.
site_dir: .docs-site
docs_dir: docs
exclude_docs: "_*"
strict: true
theme:
  name: material
  # Each area is a tab with its own sidebar (kiln ADR-0013); an area's
  # index.md is the tab's page, so no area's pages stack on another's.
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: auto
            heading_level: 2
            inherited_members: true
            merge_init_into_class: true
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
# The nav below is derived by `kiln docs-generate` from docs/_areas.yml and
# the tree — do not hand-edit between the markers; run `task docs:generate`
# after adding a page. `task lint` fails on a stale nav.
nav:
  # BEGIN derived nav
  - Home: index.md
  - Architecture:
      - architecture/index.md
  - Guides:
      - guides/index.md
      - Development: guides/development.md
  - Runbooks:
      - runbooks/index.md
      - Recovering from drift: runbooks/recovering-from-drift.md
  - Reference:
      - reference/index.md
      - Python API: reference/python-api.md
  - Releases: releases/index.md
  - Specs:
      - specs/index.md
      - Epics: specs/epics/index.md
      - Ideas:
          - specs/ideas/index.md
  - Decisions: adr/index.md
# END derived nav
